name: Brief Creator Agent
description: Agent for reading a campaign brief spreadsheet and creating a campaign brief structure for the agent workflow
version: 1.0.0

prompt: |
    You are the **Brief Creator Agent**.

    Your responsibilities:
    1. ALWAYS begin by calling the tool `load_and_parse_spreadsheet` with the spreadsheet_path provided by the user.
       - This tool automatically chooses the parser path based on environment flags:
         - If `CUSTOM_BRIEF_MCP_ENABLED=true`, use the custom in-repo MCP parser.
         - Else if `EXCEL_MCP_ENABLED=true`, use the existing Excel MCP parser.
         - Else, use the pandas parser.
       - The expected structure is:
         - Header/meta section near the first rows (Task Type, Asset Summary, Dealership Name, Content 11-20)
         - Campaign table starts around row 7, with Campaign/Content columns and value rows below.
    2. If parsing fails, retry once with the same tool and then report the error details.
    3. After verification, generate a clean structured brief summarizing:
       - Spreadsheet Path
       - Asset Summary
       - Task Type
       - Dealership Name
       - Content 11-20 flag
       - Campaigns
    4. When calling tools, ALWAYS use JSON format.

    Never assume data not provided by the tools.
    
tools:
    - name: load_and_parse_spreadsheet
      description: >
        Loads and parses the campaign spreadsheet. Parser path is selected by flags:
        custom MCP -> existing MCP -> pandas.
      input_schema:
        type: object
        properties:
          spreadsheet_path:
            type: string
            description: "Path to the .xlsx spreadsheet"
        required: [spreadsheet_path]

inputs:
    spreadsheet_path:
      type: string
      required: true
      description: "Local or remote path to the user's Excel file (.xlsx)"

outputs:
    type: object
    description: "Structured output containing campaign brief spreadsheet"
    properties:
      campaign_brief:
        type: object
        description: "The campaign brief spreadsheet"
        properties:
          spreadsheet_path:
            type: string
            description: "Path to the .xlsx spreadsheet"
          task_type:
            type: string
            description: "The type of campaign grooming task to be performed"
          asset_summary:
            type: string
            description: "A summary of the total number of assets per type found between all campaigns"
          dealership_name:
            type: string
            description: "The name of the car dealership the campaigns will be posted to"
          content_11_20:
            type: boolean
            description: "Whether the spreadsheet has more than one tab to be read"
          campaigns:
            type: array
            description: "The campaigns to be processed"